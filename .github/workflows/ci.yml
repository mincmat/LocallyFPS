name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  portable-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install --disable-pip-version-check -r requirements-gui.txt
      - name: Build graphical application
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name LocallyFPS \
            --add-data "languages:languages" \
            --add-data "packaging/locallyfps.svg:packaging" \
            --hidden-import platforms.linux \
            --hidden-import platforms.windows \
            --hidden-import platforms.macos \
            locallyfps_gui.py
      - name: Smoke-test graphical application
        shell: bash
        run: |
          executable="dist/LocallyFPS/LocallyFPS"
          if [ "$RUNNER_OS" = "Windows" ]; then executable="dist/LocallyFPS/LocallyFPS.exe"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then executable="dist/LocallyFPS.app/Contents/MacOS/LocallyFPS"; fi
          "$executable" --network-smoke-test
          QT_QPA_PLATFORM=offscreen "$executable" --smoke-test
      - name: Build and smoke-test AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PYTHON=python packaging/build_appimage.sh
          QT_QPA_PLATFORM=offscreen dist/*.AppImage --appimage-extract-and-run --smoke-test
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: LocallyFPS-v4-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
